spring.application.name=debugmate-mvp
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/debugmate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

server.error.include-message=always

app.jwt.secret=${JWT_SECRET:debugmate-local-development-secret-key-change-me}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.admin.email=${ADMIN_EMAIL:hanbyeol5002@gmail.com}
app.admin.password=${ADMIN_PASSWORD:}
