<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>오류 상세 · DebugMate</title><link rel="stylesheet" th:href="@{/css/app.css(v='20261029-3')}"><script defer th:src="@{/js/app.js(v='20261029-3')}"></script></head><body><header th:replace="~{fragments/layout :: header('history')}"></header><main id="main-content" class="container page-shell narrow"><div class="flash" th:if="${message}" th:text="${message}"></div><div class="detail-heading"><div><p class="eyebrow" th:text="${errorCase.language + (#strings.isEmpty(errorCase.framework) ? '' : ' · ' + errorCase.framework)}">JAVA</p><h1 th:text="${errorCase.title}">오류 제목</h1><time th:text="${#temporals.format(errorCase.createdAt, 'yyyy.MM.dd HH:mm')}">날짜</time></div><span class="status" th:classappend="${' status-' + errorCase.status.name().toLowerCase()}" th:text="${errorCase.status.label}">상태</span></div>
<section class="detail-block"><h2>소스 코드</h2><pre th:text="${errorCase.sourceCode}"></pre></section><section class="detail-block"><h2>오류 로그</h2><pre class="error-code" th:text="${errorCase.errorLog}"></pre></section><section class="detail-block" th:if="${!#strings.isEmpty(errorCase.previousAttempts)}"><h2>시도한 방법</h2><p class="pre-wrap" th:text="${errorCase.previousAttempts}"></p></section>
<section class="ai-placeholder"><div><p class="eyebrow">AI ANALYSIS</p><h2>AI 분석은 다음 단계에서 연결됩니다.</h2><p>추후 오류 원인, 수정안, 설명과 검증 절차가 이 영역에 표시됩니다.</p></div><button class="button disabled" type="button" disabled>AI 분석 준비 중</button></section>
<form class="status-form" th:action="@{/errors/{id}/status(id=${errorCase.id})}" method="post"><label for="status">해결 상태</label><select id="status" name="status"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status.label}" th:selected="${status == errorCase.status}"></option></select><button class="button primary" type="submit">상태 저장</button></form><section class="admin-danger-zone" sec:authorize="hasRole('ADMIN')"><div><strong>관리자 게시글 관리</strong><p>삭제한 게시글은 복구할 수 없습니다.</p></div><form th:action="@{/errors/{id}/delete(id=${errorCase.id})}" method="post" onsubmit="return confirm('이 오류 게시글을 삭제하시겠습니까?');"><button class="button danger" type="submit">게시글 삭제</button></form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
